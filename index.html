<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXUS // Spatial AI Engine</title>
  <style>
    :root {
      --neon-cyan: #00f0ff;
      --neon-green: #00ff88;
      --neon-red: #ff3366;
      --panel-bg: rgba(8, 12, 18, 0.84);
      --panel-border: rgba(0, 240, 255, 0.28);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #020406;
      color: #e2f4ff;
      font-family: Consolas, "Courier New", monospace;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    /* Camera Initialization Modal */
    #start-modal {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, rgba(8, 14, 24, 0.94) 0%, rgba(2, 4, 6, 0.98) 100%);
      z-index: 50;
      text-align: center;
      padding: 24px;
    }
    .start-card {
      max-width: 440px;
      padding: 36px 28px;
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      box-shadow: 0 0 50px rgba(0, 240, 255, 0.15);
    }
    .open-cam-btn {
      margin-top: 20px;
      background: linear-gradient(135deg, var(--neon-cyan), #0077ff);
      color: #03080f;
      font-weight: 800;
      letter-spacing: 1.5px;
      font-size: 13px;
      border: none;
      border-radius: 30px;
      padding: 14px 28px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s ease;
    }
    .open-cam-btn:hover {
      box-shadow: 0 0 24px var(--neon-cyan);
      transform: scale(1.03);
    }
    #viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }
    video, canvas {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Mirror webcam view */
    }
    canvas {
      transform: none; /* Canvas renders in standard screen coordinates */
    }
    .hud-grid {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(rgba(0, 240, 255, 0.035) 1px, transparent 1px),
                  linear-gradient(90deg, rgba(0, 240, 255, 0.035) 1px, transparent 1px);
      background-size: 48px 48px;
      z-index: 2;
    }
    header {
      position: absolute;
      top: 18px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      z-index: 10;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--neon-cyan);
      font-size: 15px;
    }
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      background: rgba(0, 255, 136, 0.12);
      color: var(--neon-green);
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid rgba(0, 255, 136, 0.35);
    }
    .status-dot {
      width: 7px;
      height: 7px;
      background: var(--neon-green);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--neon-green);
    }
    .exit-btn {
      background: rgba(255, 51, 102, 0.12);
      color: var(--neon-red);
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 1px;
      border: 1px solid rgba(255, 51, 102, 0.4);
      border-radius: 20px;
      padding: 6px 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .exit-btn:hover {
      background: var(--neon-red);
      color: #fff;
      box-shadow: 0 0 16px var(--neon-red);
    }

    #telemetry {
      position: absolute;
      top: 85px;
      left: 20px;
      width: 380px;
      padding: 16px 20px;
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      z-index: 10;
      display: none;
      box-shadow: 0 12px 35px rgba(0,0,0,0.7);
    }
    .pill {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 3px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
    }
    .pill.success { background: rgba(0, 255, 136, 0.2); color: var(--neon-green); border: 1px solid var(--neon-green); }
    .pill.danger { background: rgba(255, 51, 102, 0.2); color: var(--neon-red); border: 1px solid var(--neon-red); }

    #dock {
      display: none;
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 14px;
      background: var(--panel-bg);
      backdrop-filter: blur(24px);
      border: 1px solid var(--panel-border);
      border-radius: 50px;
      z-index: 10;
      box-shadow: 0 10px 40px rgba(0, 240, 255, 0.15);
    }
    #item-input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      padding: 10px 14px;
      width: 240px;
    }
    #scan-btn {
      background: linear-gradient(135deg, var(--neon-cyan), #0077ff);
      color: #03080f;
      font-weight: 800;
      border: none;
      border-radius: 30px;
      padding: 12px 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    #scan-btn:hover {
      box-shadow: 0 0 24px var(--neon-cyan);
      transform: scale(1.02);
    }
    #scan-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .radar-line {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
      box-shadow: 0 0 16px var(--neon-cyan);
      opacity: 0;
      z-index: 4;
    }
    .scanning .radar-line {
      opacity: 1;
      animation: radarScan 1.6s infinite ease-in-out;
    }
    @keyframes radarScan {
      0% { top: 0%; }
      50% { top: 100%; }
      100% { top: 0%; }
    }

    #shutdown-view {
      position: absolute;
      inset: 0;
      background: rgba(3, 5, 8, 0.96);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
  </style>
</head>
<body>
  <div id="viewport">
    <div class="hud-grid"></div>
    <div class="radar-line"></div>
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
<!-- Camera Start Modal -->
    <div id="start-modal">
      <div class="start-card">
        <h2 style="color: #fff; letter-spacing: 2px; font-size: 18px; margin-bottom: 8px;">NEXUS OPTICAL ENGINE</h2>
        <p style="color: #8da4b8; font-size: 13px; line-height: 1.5;">Hardware sensor is currently disengaged. Engage camera access to initialize spatial grounding.</p>
        <button class="open-cam-btn" onclick="startCameraSession()">
          <span>ENGAGE CAMERA</span>
        </button>
      </div>
    </div>
    <header>
      <div class="brand">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
          <polyline points="2 17 12 22 22 17"></polyline>
          <polyline points="2 12 12 17 22 12"></polyline>
        </svg>
        <span>NEXUS // SPATIAL AI</span>
      </div>
      <div class="nav-actions">
        <div class="status-badge"><div class="status-dot"></div> ENGINE ONLINE</div>
        <button class="exit-btn" onclick="terminateSession()">EXIT</button>
      </div>
    </header>

    <div id="telemetry">
      <div id="telemetry-pill" class="pill">DIAGNOSTIC</div>
      <div id="telemetry-reason" style="font-size: 13px; line-height: 1.5; margin-bottom: 8px;">Awaiting scan target...</div>
      <div id="telemetry-hazards" style="font-size: 11px; color: var(--neon-cyan);"></div>
    </div>

    <div id="dock">
      <input type="text" id="item-input" value="painting" placeholder="Target item to place/mount..." />
      <button id="scan-btn" onclick="executeScan()">
        <span>EXECUTE SCAN</span>
      </button>
    </div>

    <div id="shutdown-view">
      <h2 style="color: var(--neon-red); letter-spacing: 3px; margin-bottom: 12px;">// SYSTEM TERMINATED</h2>
      <p style="color: #8da4b8; font-size: 13px; margin-bottom: 24px;">CAMERA FEED DEACTIVATED • HARDWARE DISENGAGED</p>
      <button onclick="restartSession()" style="background: transparent; border: 1px solid var(--neon-cyan); color: var(--neon-cyan); padding: 10px 24px; border-radius: 30px; font-family: inherit; font-weight: 700; cursor: pointer;">
        REINITIALIZE ENGINE
      </button>
    </div>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('overlay');
    const ctx = canvas.getContext('2d');
    const itemInput = document.getElementById('item-input');
    const scanBtn = document.getElementById('scan-btn');
    const telemetry = document.getElementById('telemetry');
    const tPill = document.getElementById('telemetry-pill');
    const tReason = document.getElementById('telemetry-reason');
    const tHazards = document.getElementById('telemetry-hazards');
    const viewport = document.getElementById('viewport');
    const shutdownView = document.getElementById('shutdown-view');

    let stream = null;
    let targetBox = null;
    let animatedBox = null;
    let currentItem = "";
    let animId = null;

    function syncDimensions() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', syncDimensions);
    syncDimensions();

    async function initCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1920 }, height: { ideal: 1080 }, facingMode: "environment" }
        });
        video.srcObject = stream;
        video.play();
        render();
      } catch (err) {
        alert("Camera access error: " + err.message);
      }
    }

    function terminateSession() {
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
      video.srcObject = null;
      if (animId) cancelAnimationFrame(animId);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      targetBox = null;
      animatedBox = null;
      telemetry.style.display = "none";
      shutdownView.style.display = "flex";
    }

    function restartSession() {
      shutdownView.style.display = "none";
      initCamera();
    }

    function drawBrackets(x1, y1, x2, y2, color, len = 20) {
      ctx.strokeStyle = color;
      ctx.lineWidth = 3;
      ctx.shadowColor = color;
      ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.moveTo(x1, y1 + len); ctx.lineTo(x1, y1); ctx.lineTo(x1 + len, y1); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x2 - len, y1); ctx.lineTo(x2, y1); ctx.lineTo(x2, y1 + len); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x1, y2 - len); ctx.lineTo(x1, y2); ctx.lineTo(x1 + len, y2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x2 - len, y2); ctx.lineTo(x2, y2); ctx.lineTo(x2, y2 - len); ctx.stroke();
      ctx.shadowBlur = 0;
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (targetBox && video.videoWidth > 0) {
        if (!animatedBox) animatedBox = [...targetBox];
        for (let i = 0; i < 4; i++) {
          animatedBox[i] += (targetBox[i] - animatedBox[i]) * 0.18;
        }

        const [ymin, xmin, ymax, xmax] = animatedBox;
        const vRatio = video.videoWidth / video.videoHeight;
        const cRatio = canvas.width / canvas.height;

        let renderW, renderH, offX, offY;
        if (cRatio > vRatio) {
          renderW = canvas.width;
          renderH = canvas.width / vRatio;
          offX = 0;
          offY = (canvas.height - renderH) / 2;
        } else {
          renderW = canvas.height * vRatio;
          renderH = canvas.height;
          offX = (canvas.width - renderW) / 2;
          offY = 0;
        }

        // Horizontal flip mapping: Invert X for mirrored webcam view
        const mirroredXmin = 1000 - xmax;
        const mirroredXmax = 1000 - xmin;

        const x1 = offX + (mirroredXmin / 1000) * renderW;
        const y1 = offY + (ymin / 1000) * renderH;
        const x2 = offX + (mirroredXmax / 1000) * renderW;
        const y2 = offY + (ymax / 1000) * renderH;

        ctx.fillStyle = "rgba(0, 255, 136, 0.18)";
        ctx.fillRect(x1, y1, x2 - x1, y2 - y1);
        drawBrackets(x1, y1, x2, y2, "#00ff88", 22);

        const cx = (x1 + x2) / 2;
        const cy = (y1 + y2) / 2;
        ctx.strokeStyle = "#00ff88";
        ctx.beginPath();
        ctx.arc(cx, cy, 6, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = "#00ff88";
        ctx.font = "700 12px monospace";
        ctx.fillText(`LOCKED // ${currentItem.toUpperCase()}`, x1, Math.max(22, y1 - 10));
      }

      animId = requestAnimationFrame(render);
    }

    async function executeScan() {
      const item = itemInput.value.trim();
      if (!item || !stream) return;

      scanBtn.disabled = true;
      scanBtn.querySelector("span").textContent = "CALCULATING...";
      viewport.classList.add("scanning");

      const captureCanvas = document.createElement('canvas');
      captureCanvas.width = video.videoWidth || 1280;
      captureCanvas.height = video.videoHeight || 720;
      const cCtx = captureCanvas.getContext('2d');
      cCtx.drawImage(video, 0, 0, captureCanvas.width, captureCanvas.height);
      const b64 = captureCanvas.toDataURL('image/jpeg', 0.92);

      try {
        const res = await fetch('/api/scan', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image_base64: b64, target_item: item })
        });
        const data = await res.json();

        telemetry.style.display = "block";
        if (data.space_found && data.box_2d) {
          targetBox = data.box_2d;
          currentItem = item;
          tPill.className = "pill success";
          tPill.textContent = `OPTIMAL LOCK (${data.confidence_score || 96}%)`;
          tReason.textContent = data.reasoning;
          tHazards.textContent = data.hazards_avoided?.length ? "Mitigated: " + data.hazards_avoided.join(" • ") : "";
        } else {
          targetBox = null;
          animatedBox = null;
          tPill.className = "pill danger";
          tPill.textContent = "SPACE BLOCKED / UNCLEAR";
          tReason.textContent = data.reasoning || "No unobstructed surface detected.";
          tHazards.textContent = "";
        }
      } catch (err) {
        alert("Scan Error: " + err.message);
      } finally {
        scanBtn.disabled = false;
        scanBtn.querySelector("span").textContent = "EXECUTE SCAN";
        viewport.classList.remove("scanning");
      }
    }

    itemInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') executeScan();
    });

    async function startCameraSession() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 1920 }, height: { ideal: 1080 }, facingMode: "environment" }
    });
    video.srcObject = stream;
    await video.play();

    document.getElementById('start-modal').style.display = "none";
    document.getElementById('dock').style.display = "flex";
    render();
  } catch (err) {
    alert("Camera access denied: " + err.message);
  }
}
  </script>
</body>
</html>
