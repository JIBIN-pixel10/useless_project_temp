<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXUS // Spatial AI Engine</title>
  <style>
    :root {
      --neon-cyan: #00f0ff;
      --neon-green: #00ff88;
      --neon-red: #ff3366;
      --bg-dark: rgba(10, 14, 22, 0.85);
      --border-cyan: rgba(0, 240, 255, 0.35);
      --border-red: rgba(255, 51, 102, 0.4);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #05070a;
      color: #e0f8ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    #viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }
    video, canvas {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .grid-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(rgba(0, 240, 255, 0.04) 1px, transparent 1px),
                  linear-gradient(90deg, rgba(0, 240, 255, 0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 2;
    }
    header {
      position: absolute;
      top: 20px;
      left: 24px;
      right: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      background: var(--bg-dark);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-cyan);
      border-radius: 12px;
      z-index: 10;
    }
    .brand {
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--neon-cyan);
      font-size: 16px;
    }
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .status-pill {
      font-size: 11px;
      background: rgba(0, 255, 136, 0.15);
      color: var(--neon-green);
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid rgba(0, 255, 136, 0.4);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot { width: 7px; height: 7px; background: var(--neon-green); border-radius: 50%; box-shadow: 0 0 8px var(--neon-green); }

    /* Tactical Exit Button */
    #exit-btn {
      background: rgba(255, 51, 102, 0.12);
      color: var(--neon-red);
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 1px;
      border: 1px solid var(--border-red);
      border-radius: 20px;
      padding: 6px 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    #exit-btn:hover {
      background: var(--neon-red);
      color: #fff;
      box-shadow: 0 0 16px var(--neon-red);
      transform: scale(1.04);
    }
    
    #telemetry {
      position: absolute;
      top: 90px;
      left: 24px;
      width: 360px;
      padding: 16px;
      background: var(--bg-dark);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-cyan);
      border-radius: 12px;
      z-index: 10;
      display: none;
    }
    .badge {
      display: inline-block;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 1px;
      padding: 3px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
    }
    .badge.success { background: rgba(0, 255, 136, 0.2); color: var(--neon-green); border: 1px solid var(--neon-green); }
    .badge.danger { background: rgba(255, 51, 102, 0.2); color: var(--neon-red); border: 1px solid var(--neon-red); }

    #control-dock {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 14px;
      background: var(--bg-dark);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-cyan);
      border-radius: 50px;
      z-index: 10;
      box-shadow: 0 10px 40px rgba(0, 240, 255, 0.15);
    }
    #item-input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 15px;
      padding: 10px 14px;
      width: 250px;
    }
    #scan-btn {
      background: linear-gradient(135deg, var(--neon-cyan), #0077ff);
      color: #050a14;
      font-weight: 800;
      border: none;
      border-radius: 30px;
      padding: 12px 24px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: all 0.2s ease;
    }
    #scan-btn:hover { box-shadow: 0 0 20px var(--neon-cyan); transform: scale(1.03); }
    #scan-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Session Terminated Standby Screen */
    #shutdown-overlay {
      position: absolute;
      inset: 0;
      background: rgba(4, 6, 10, 0.96);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    #shutdown-overlay h2 {
      color: var(--neon-red);
      letter-spacing: 4px;
      font-size: 24px;
      margin-bottom: 12px;
    }
    #shutdown-overlay p {
      color: #7a8fa3;
      font-size: 13px;
      margin-bottom: 24px;
      letter-spacing: 1px;
    }
    #reconnect-btn {
      background: transparent;
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      padding: 10px 24px;
      border-radius: 30px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 1px;
      transition: all 0.2s ease;
    }
    #reconnect-btn:hover {
      background: var(--neon-cyan);
      color: #040608;
      box-shadow: 0 0 20px var(--neon-cyan);
    }

    .radar-sweep {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 4px;
      background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
      box-shadow: 0 0 15px var(--neon-cyan);
      opacity: 0;
      z-index: 4;
    }
    .scanning .radar-sweep {
      opacity: 1;
      animation: sweep 1.8s infinite ease-in-out;
    }
    @keyframes sweep {
      0% { top: 0%; }
      50% { top: 100%; }
      100% { top: 0%; }
    }
  </style>
</head>
<body>
  <div id="viewport">
    <div class="grid-overlay"></div>
    <div class="radar-sweep" id="radar"></div>
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>

    <header>
      <div class="brand">NEXUS // SPATIAL AI OPTIMIZER</div>
      <div class="nav-actions">
        <div class="status-pill"><div class="dot"></div> ENGINE ONLINE</div>
        <button id="exit-btn" onclick="terminateSession()">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
          EXIT
        </button>
      </div>
    </header>

    <div id="telemetry">
      <div id="telemetry-badge" class="badge">STATUS</div>
      <div id="telemetry-reason" style="font-size: 13px; line-height: 1.5; margin-bottom: 8px;">Awaiting scan target...</div>
      <div id="telemetry-hazards" style="font-size: 11px; color: var(--neon-cyan);"></div>
    </div>

    <div id="control-dock">
      <input type="text" id="item-input" value="Water Bottle" placeholder="Target item to place..." />
      <button id="scan-btn" onclick="executeScan()">EXECUTE SCAN</button>
    </div>

    <!-- Terminated Standby Screen -->
    <div id="shutdown-overlay">
      <h2>// SYSTEM TERMINATED</h2>
      <p>CAMERA STREAM OFFLINE • TELEMETRY DISENGAGED</p>
      <button id="reconnect-btn" onclick="restartSession()">REINITIALIZE SYSTEM</button>
    </div>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('overlay');
    const ctx = canvas.getContext('2d');
    const itemInput = document.getElementById('item-input');
    const scanBtn = document.getElementById('scan-btn');
    const telemetry = document.getElementById('telemetry');
    const tBadge = document.getElementById('telemetry-badge');
    const tReason = document.getElementById('telemetry-reason');
    const tHazards = document.getElementById('telemetry-hazards');
    const viewport = document.getElementById('viewport');
    const shutdownOverlay = document.getElementById('shutdown-overlay');

    let currentStream = null;
    let currentBox = null;
    let targetName = "";
    let animationFrameId = null;

    function setCanvasDimensions() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    setCanvasDimensions();
    window.addEventListener('resize', setCanvasDimensions);

    async function initCamera() {
      try {
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" }
        });
        video.srcObject = currentStream;
        video.play();
        renderLoop();
      } catch (err) {
        alert("Camera access required: " + err.message);
      }
    }

    function terminateSession() {
      // 1. Kill all camera tracks so hardware indicator LED turns off
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
        currentStream = null;
      }
      video.srcObject = null;

      // 2. Stop render loop & clear canvas
      if (animationFrameId) {
        cancelAnimationFrame(animationFrameId);
      }
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      currentBox = null;
      telemetry.style.display = "none";

      // 3. Show standby shutdown overlay
      shutdownOverlay.style.display = "flex";
    }

    function restartSession() {
      shutdownOverlay.style.display = "none";
      initCamera();
    }

    function drawCornerBrackets(x1, y1, x2, y2, color, len = 20) {
      ctx.strokeStyle = color;
      ctx.lineWidth = 3;
      ctx.shadowColor = color;
      ctx.shadowBlur = 10;
      ctx.beginPath(); ctx.moveTo(x1, y1 + len); ctx.lineTo(x1, y1); ctx.lineTo(x1 + len, y1); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x2 - len, y1); ctx.lineTo(x2, y1); ctx.lineTo(x2, y1 + len); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x1, y2 - len); ctx.lineTo(x1, y2); ctx.lineTo(x1 + len, y2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x2 - len, y2); ctx.lineTo(x2, y2); ctx.lineTo(x2, y2 - len); ctx.stroke();
      ctx.shadowBlur = 0;
    }

    function renderLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (currentBox) {
        const [ymin, xmin, ymax, xmax] = currentBox;
        const x1 = (xmin / 1000) * canvas.width;
        const y1 = (ymin / 1000) * canvas.height;
        const x2 = (xmax / 1000) * canvas.width;
        const y2 = (ymax / 1000) * canvas.height;

        ctx.fillStyle = "rgba(0, 255, 136, 0.15)";
        ctx.fillRect(x1, y1, x2 - x1, y2 - y1);
        drawCornerBrackets(x1, y1, x2, y2, "#00ff88", 22);

        const cx = (x1 + x2) / 2;
        const cy = (y1 + y2) / 2;
        ctx.strokeStyle = "#00ff88";
        ctx.beginPath();
        ctx.arc(cx, cy, 6, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = "#00ff88";
        ctx.font = "bold 13px monospace";
        ctx.fillText(`TARGET ZONE // ${targetName.toUpperCase()}`, x1, y1 - 10);
      }
      animationFrameId = requestAnimationFrame(renderLoop);
    }

    async function executeScan() {
      const item = itemInput.value.trim();
      if (!item || !currentStream) return;

      scanBtn.disabled = true;
      scanBtn.textContent = "ANALYZING...";
      viewport.classList.add("scanning");

      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = video.videoWidth || 640;
      tempCanvas.height = video.videoHeight || 480;
      const tCtx = tempCanvas.getContext('2d');
      tCtx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);
      const b64 = tempCanvas.toDataURL('image/jpeg', 0.85);

      try {
        const res = await fetch('/api/scan', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image_base64: b64, target_item: item })
        });
        const data = await res.json();

        telemetry.style.display = "block";
        if (data.space_found && data.box_2d) {
          currentBox = data.box_2d;
          targetName = item;
          tBadge.className = "badge success";
          tBadge.textContent = "COORDINATES LOCKED";
          tReason.textContent = data.reasoning;
          tHazards.textContent = data.hazards_avoided?.length ? "Protected: " + data.hazards_avoided.join(", ") : "";
        } else {
          currentBox = null;
          tBadge.className = "badge danger";
          tBadge.textContent = "NO CLEARANCE DETECTED";
          tReason.textContent = data.reasoning || "Workspace blocked.";
          tHazards.textContent = "";
        }
      } catch (err) {
        alert("Scan Error: " + err.message);
      } finally {
        scanBtn.disabled = false;
        scanBtn.textContent = "EXECUTE SCAN";
        viewport.classList.remove("scanning");
      }
    }

    itemInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') executeScan();
    });

    initCamera();
  </script>
</body>
</html>
